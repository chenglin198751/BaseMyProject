plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
apply from: '../common.gradle'

def apk_release_path, apk_debug_path

android {
    namespace 'com.wcl.test'
    compileSdk = project.ext.COMPILE_SDK_VERSION

    defaultConfig {
        applicationId "com.wcl.test"
        minSdk project.ext.MIN_SDK_VERSION
        targetSdk project.ext.TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0.0.1"
        multiDexEnabled true

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a', 'armeabi-v7a'
            packagingOptions {
                doNotStrip '*/arm64-v8a/*.so'
                doNotStrip '*/armeabi-v7a/*.so'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('../keystore_debug.jks')
            keyAlias 'young_debug'
            storePassword '123abc'
            keyPassword '123abc'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
            buildConfigField 'boolean', 'LOG_ENABLED', 'true'
            manifestPlaceholders.put("test_app_key", "debug_111111")
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'LOG_ENABLED', 'false'
            manifestPlaceholders.put("test_app_key", "release_0000000")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            it.outputFileName = "base_project_v_" + defaultConfig.versionName + ".apk"
            if (variant.name == 'release') {
                apk_release_path = it.outputFile.getAbsolutePath()
            } else if (variant.name == 'debug') {
                apk_debug_path = it.outputFile.getAbsolutePath()
            }
        }
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
    implementation 'com.squareup.okio:okio:3.16.2'
//    implementation 'org.conscrypt:conscrypt-openjdk-uber:2.2.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.getActivity:GsonFactory:10.3'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    implementation 'io.github.scwang90:refresh-layout-kernel:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-header-classics:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-header-radar:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-header-falsify:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-header-material:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-header-two-level:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-footer-ball:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-footer-classics:3.0.0-alpha'

    implementation 'io.github.youth5201314:banner:2.2.3'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:5.0.5'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'com.github.donkingliang:ConsecutiveScroller:4.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'com.github.JavaNoober.BackgroundLibrary:libraryx:1.7.6'
    implementation 'androidx.work:work-runtime:2.11.0'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'com.github.hackware1993:MagicIndicator:1.7.0'
}
