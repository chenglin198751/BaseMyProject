plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

jar {
    manifest {
        attributes(
                'Manifest-Version': '1.0',
                'Main-Class': 'org.eclipse.jdt.internal.jarinjarloader.JarRsrcLoader',
                // 修改点1：引用的jar文件，格式必须'./ aa.jar bb.jar'，注意每个jar之间有空格。如果没有引用jar，这里就写'./'
                'Rsrc-Class-Path': './ ant_v1.10.12.jar',
                // 修改点2：当前可执行jar的main方法入口类
                'Rsrc-Main-Class': 'main.Main',
                'Class-Path': '.'
        )
    }
}

import javax.inject.Inject

abstract class FatJarTask extends DefaultTask {
    private final ExecOperations execOps

    @Inject
    FatJarTask(ExecOperations execOps) {
        this.execOps = execOps
    }

    @TaskAction
    void fatJar() {
        def buildDir = project.layout.buildDirectory.get().asFile
        def jarParentDir = "${buildDir}/libs"
        def tmpJarFile = "${jarParentDir}/${project.name}.jar"
        // 修改点3：修改为对外输出的jar名字
        def jarName = 'xm_fast_build'
        def jarNameDir = "${jarParentDir}/${jarName}"

        //修改点4：修改为jar对外输出的路径名
        def final outPutJarPath = project.projectDir

        if (!project.file(tmpJarFile).exists()) {
            logger.warn("临时jar文件不存在: ${tmpJarFile}")
            return
        }

        // 1. 解压jar
        project.delete(jarNameDir)
        project.mkdir(jarNameDir)
        execOps.exec {
            workingDir jarNameDir
            commandLine 'jar', '-xvf', tmpJarFile
        }

        // 2. 拷贝依赖文件
        project.copy {
            from 'libs'
            into jarNameDir
        }
        project.copy {
            from 'eclipse_main'
            into jarNameDir
        }

        // 3. 合并为可执行jar
        def manifestPath = "${jarNameDir}/META-INF/MANIFEST.MF"
        execOps.exec {
            workingDir jarNameDir
            commandLine 'jar', '-cvfm', "${jarName}.jar", manifestPath, '*'
        }

        // 4. 移动最终jar，并清理残余文件
        def finalJar = "${jarNameDir}/${jarName}.jar"
        def destinationJar = "${outPutJarPath}/${jarName}.jar"
        project.delete(destinationJar)
        project.file(finalJar).renameTo(project.file(destinationJar))
        project.delete(buildDir)
    }
}

// 注册自定义 Task
tasks.register('fatJar', FatJarTask)

// 在 assemble 后自动执行 fatJar
afterEvaluate {
    assemble.finalizedBy tasks.named('fatJar')
}